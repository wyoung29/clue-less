<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Clue-Less Test Client</title>
<style>
  body { font-family: sans-serif; margin: 16px; }
  fieldset { margin-bottom: 8px; }
  #hand { display: flex; flex-wrap: wrap; gap: 8px; padding: 0; list-style: none; }
  #hand li { border: 1px solid #777; border-radius: 4px; padding: 8px 12px; }
  #log { font-family: monospace; font-size: 12px; border: 1px solid #999; height: 320px; overflow-y: scroll; padding: 4px; white-space: pre-wrap; }
  .out { color: #555; } .bcast { color: #a33; } .ucast { color: #236; }
</style>
</head>
<body>
<h2>Clue-Less Test Client (Skeletal)</h2>
<p id="status">Not connected</p>

<fieldset><legend>Lobby</legend>
  Name <input id="name" value="Player">
  <button onclick="PlayerInput.createGame()">C1 Create game</button>
  Game code <input id="code" size="7">
  <button onclick="PlayerInput.joinGame()">C2 Join game</button>
  <button onclick="PlayerInput.startGame()">C4 Start game</button>
</fieldset>

<fieldset><legend>Your cards</legend>
  <p id="handStatus">Cards will appear here when the game starts.</p>
  <ul id="hand"></ul>
</fieldset>

<fieldset><legend>Game</legend>
  Move to <select id="to" disabled><option>Start a game to see legal moves</option></select>
  <button id="moveButton" onclick="PlayerInput.move()" disabled>C6 Move</button><br>
  Suspect
  <select id="suspect">
    <option value="SCARLET">Miss Scarlet</option>
    <option value="MUSTARD">Colonel Mustard</option>
    <option value="WHITE">Mrs. White</option>
    <option value="GREEN">Mr. Green</option>
    <option value="PEACOCK">Mrs. Peacock</option>
    <option value="PLUM" selected>Professor Plum</option>
  </select>
  Weapon
  <select id="weapon">
    <option value="CANDLESTICK">Candlestick</option>
    <option value="KNIFE">Knife</option>
    <option value="LEAD_PIPE">Lead Pipe</option>
    <option value="REVOLVER">Revolver</option>
    <option value="ROPE" selected>Rope</option>
    <option value="WRENCH">Wrench</option>
  </select>
  Room
  <select id="room">
    <option value="KITCHEN">Kitchen</option>
    <option value="BALLROOM">Ballroom</option>
    <option value="CONSERVATORY">Conservatory</option>
    <option value="DINING_ROOM">Dining Room</option>
    <option value="BILLIARD_ROOM">Billiard Room</option>
    <option value="LIBRARY">Library</option>
    <option value="LOUNGE">Lounge</option>
    <option value="HALL" selected>Hall</option>
    <option value="STUDY">Study</option>
  </select>
  <button onclick="PlayerInput.accuse()">C9 Accuse</button>
</fieldset>

<div id="log"></div>

<script>
// Client subsystem components (SRS 2.2.2), kept minimal for the skeletal increment.

// Local Game State: what this client knows from the server.
const LocalGameState = {
  gameId: null, playerId: null, token: null, lastSeq: 0, hand: [],
  apply(msg) {
    if (msg.seq != null) this.lastSeq = msg.seq;
    if (msg.type === 'U1_HAND_DEALT' && Array.isArray(msg.payload?.cards)) {
      this.hand = msg.payload.cards;
      GUI.renderHand(this.hand);
    }
    if (msg.type === 'B4_GAME_STARTED' || msg.type === 'B6_PLAYER_MOVED') {
      PlayerInput.refreshMoves();
    }
    GUI.render(msg);
  }
};

// GUI: shows every message sent and received.
const GUI = {
  log(text, cls) {
    const div = document.createElement('div');
    div.className = cls || '';
    div.textContent = new Date().toLocaleTimeString() + '  ' + text;
    const log = document.getElementById('log');
    log.appendChild(div);
    log.scrollTop = log.scrollHeight;
  },
  render(msg) {
    const cls = msg.type.startsWith('B') ? 'bcast' : 'ucast';
    const seq = msg.seq != null ? ' seq=' + msg.seq : '';
    this.log('RECV ' + msg.type + seq + ' ' + JSON.stringify(msg.payload), cls);
  },
  renderHand(cards) {
    const list = document.getElementById('hand');
    list.replaceChildren(...cards.map(card => {
      const item = document.createElement('li');
      item.textContent = card;
      return item;
    }));
    document.getElementById('handStatus').textContent =
      cards.length ? 'These cards are private to you.' : 'No cards received yet.';
  },
  renderMoves(locations) {
    const select = document.getElementById('to');
    const moveButton = document.getElementById('moveButton');
    select.replaceChildren();
    if (locations.length === 0) {
      select.add(new Option('No legal moves available', ''));
      select.disabled = true;
      moveButton.disabled = true;
      return;
    }

    select.add(new Option('Choose a destination', ''));
    for (const location of locations) select.add(new Option(location, location));
    select.disabled = false;
    moveButton.disabled = false;
  }
};

// Client Communication: REST out, WebSocket in.
const ClientCommunication = {
  async send(method, path, body) {
    GUI.log('SEND ' + method + ' ' + path + ' ' + (body ? JSON.stringify(body) : ''), 'out');
    const res = await fetch(path, {
      method,
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + (LocalGameState.token || '') },
      body: body ? JSON.stringify(body) : undefined
    });
    const json = await res.json().catch(() => ({}));
    GUI.log('HTTP ' + res.status + ' ' + JSON.stringify(json), 'out');
    return json;
  },
  connect() {
    const params = new URLSearchParams({
      gameId: LocalGameState.gameId,
      playerId: LocalGameState.playerId,
      token: LocalGameState.token
    });
    const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
    const url = protocol + '//' + location.host + '/ws?' + params;
    const ws = new WebSocket(url);
    ws.onopen = () => document.getElementById('status').textContent =
      'Connected: game ' + LocalGameState.gameId + ', player ' + LocalGameState.playerId;
    ws.onclose = () => document.getElementById('status').textContent = 'Disconnected';
    ws.onmessage = e => {
      try { LocalGameState.apply(JSON.parse(e.data)); }
      catch { GUI.log('RECV ' + e.data); }   // plain-text welcome message
    };
  }
};

// Player Input: turns button clicks into client-to-server messages.
const val = id => document.getElementById(id).value;
const game = () => '/api/games/' + LocalGameState.gameId;
const PlayerInput = {
  async createGame() { this.enter(await ClientCommunication.send('POST', '/api/games', { username: val('name') })); },
  async joinGame() { this.enter(await ClientCommunication.send('POST', '/api/games/' + val('code') + '/players', { username: val('name') })); },
  enter(r) {
    if (!r.gameId) return;
    Object.assign(LocalGameState, { gameId: r.gameId, playerId: r.playerId, token: r.token });
    document.getElementById('code').value = r.gameId;
    ClientCommunication.connect();
  },
  startGame() { ClientCommunication.send('POST', game() + '/start'); },
  async refreshMoves() {
    const locations = await ClientCommunication.send('GET', game() + '/moves');
    if (Array.isArray(locations)) GUI.renderMoves(locations);
    else GUI.renderMoves([]);
  },
  move() {
    const destination = val('to');
    if (destination) ClientCommunication.send('POST', game() + '/move', { to: destination, stay: false });
  },
  accuse() { ClientCommunication.send('POST', game() + '/accusation', { suspect: val('suspect'), weapon: val('weapon'), room: val('room') }); }
};
</script>
</body>
</html>
